name: tests
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Q1 spam filter
        run: python -m unittest discover -s spam_filter -v
      - name: Q2 jug search
        run: python -m unittest discover -s jug_search -v
